name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    tags:
      - "v1.0.*"

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  QT_ARCH: "win64_msvc2022_64"

jobs:
  build-installer:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve package version
        shell: pwsh
        run: |
          $line = Get-Content CMakeLists.txt | Where-Object { $_ -match '^\s+VERSION\s+\d+\.\d+\.\d+' } | Select-Object -First 1
          if (-not $line) {
            throw "Could not resolve package version from CMakeLists.txt"
          }
          $base = ($line -replace '^\s+VERSION\s+', '' -replace '\s+$', '')
          $suffix = ""
          if ($env:GITHUB_REF_NAME -eq "dev") {
            $suffix = "-dev$(git rev-list --count HEAD)"
          }
          $version = "$base$suffix"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VERSION_BASE=$base" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Packaging Rain Log Desktop $version"

      - name: Install Qt
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          modules: qtshadertools
          cache: true

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Download the Microsoft Visual C++ runtime installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "$env:GITHUB_WORKSPACE\vc_redist.x64.exe"

      - name: Configure
        shell: pwsh
        run: |
          $suffix = $env:VERSION.Substring($env:VERSION_BASE.Length)
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_BUILD_TYPE=Release `
            -DVERSION_SUFFIX="$suffix"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Install into deployment tree
        shell: pwsh
        run: cmake --install build --prefix deploy --config Release

      - name: Deploy Qt Windows dependencies
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release --no-compiler-runtime --dir "$PWD\deploy\bin" `
            --qmldir "$PWD\qml" --qmldir "$PWD\shared" `
            "$PWD\deploy\bin\rainlog-desktop.exe"

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\RainLog-Desktop-v$env:VERSION-windows-x64.exe"
          makensis `
            "/DVERSION=$env:VERSION" `
            "/DVERSION_BASE=$env:VERSION_BASE" `
            "/DDIST_DIR=$PWD\deploy\bin" `
            "/DVC_REDIST=$PWD\vc_redist.x64.exe" `
            "/DOUTFILE=$out" `
            "packaging\windows\rainlog-desktop.nsi"

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $artifact = "$env:GITHUB_WORKSPACE\RainLog-Desktop-v$env:VERSION-windows-x64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $artifact).Hash.ToLowerInvariant()
          "$hash  RainLog-Desktop-v$env:VERSION-windows-x64.exe" | Out-File -FilePath "$artifact.sha256" -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RainLog-Desktop-v${{ env.VERSION }}-windows-x64
          path: |
            RainLog-Desktop-v${{ env.VERSION }}-windows-x64.exe
            RainLog-Desktop-v${{ env.VERSION }}-windows-x64.exe.sha256
          if-no-files-found: error
