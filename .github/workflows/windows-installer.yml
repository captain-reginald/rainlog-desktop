name: Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to package (without the leading v)
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  QT_ARCH: "win64_msvc2022_64"

jobs:
  build-installer:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve package version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = "${{ inputs.version }}"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Packaging Rain Log $version"

      - name: Install Qt
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          modules: qtshadertools
          cache: true

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Download the Microsoft Visual C++ runtime installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "$env:GITHUB_WORKSPACE\vc_redist.x64.exe"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Install into deployment tree
        shell: pwsh
        run: cmake --install build --prefix deploy --config Release

      - name: Deploy Qt Windows dependencies
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release --no-compiler-runtime --dir "$PWD\deploy\bin" `
            "$PWD\deploy\bin\rainlog.exe"

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\RainLog-v$env:VERSION-windows-x64.exe"
          makensis `
            "/DVERSION=$env:VERSION" `
            "/DDIST_DIR=$PWD\deploy\bin" `
            "/DVC_REDIST=$PWD\vc_redist.x64.exe" `
            "/DOUTFILE=$out" `
            "packaging\windows\rainlog.nsi"

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $artifact = "$env:GITHUB_WORKSPACE\RainLog-v$env:VERSION-windows-x64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $artifact).Hash.ToLowerInvariant()
          "$hash  RainLog-v$env:VERSION-windows-x64.exe" | Out-File -FilePath "$artifact.sha256" -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RainLog-v${{ env.VERSION }}-windows-x64
          path: |
            RainLog-v${{ env.VERSION }}-windows-x64.exe
            RainLog-v${{ env.VERSION }}-windows-x64.exe.sha256
          if-no-files-found: error
